# Shadmin is archived: Pages now serves a redirect to chelone.dev. The last
# deploy of the full site is in this workflow's git history.
# Requires Settings > Pages > Source = "GitHub Actions".
name: Deploy Shadmin

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions for the official GitHub Pages deployment (no branch push).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Pages serves 404.html for every deep link, so old URLs redirect too.
      - name: Assemble redirect
        run: cp redirect/index.html redirect/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
